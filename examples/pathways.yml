# Study-specific build on top of the bundled `pathways` preset.
# Everything except the targets comes from the preset (see `alien config show pathways`).
# Paths below are relative to this file; the preset's cache and output paths stay relative to the
# working directory, so run this from the repository root.
extends: pathways

targets:
  - name: gtex_v11_gencode47
    type: ensembl_gtf
    annotation:
      source: GENCODE
      version: "47"
    output_genes:
      path: ../data/gtex/GTEx_Analysis_2025-08-22_v11_RNASeQCv2.4.3_gene_reads.parquet
      id_column: index
  - name: tcga_recount3_gencode29
    type: ensembl_gtf
    annotation:
      source: GENCODE
      version: "29"
      metadata_fallbacks:
        - source: recount3
          version: G029
          path: ../data/recount3/human.gene_sums.G029.gtf.gz
    output_genes:
      path: ../data/recount3/tcga_gencode_v29_output_genes.tsv.gz
      id_column: Ensembl_gene_ID
