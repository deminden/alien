project:
  # Download/cache root for all source and mapping resources.
  source_dir: examples/fixtures/sources
  # Output root. ALIEN writes gmt/, metadata/, and qc/ subfolders here.
  outdir: examples/out

outputs:
  include_symbols: true

sources:
  - type: msigdb_tsv
    path: examples/fixtures/msigdb_like.tsv
    source_tag: REACTOME
    collection: C2
    family: biology_process_pathway
    aspect: pathway
  - type: symbol_gmt
    path: examples/fixtures/symbolic.gmt
    source: Example symbolic
    source_tag: LOCAL
    family: biology_process_pathway
    aspect: pathway

targets:
  - name: tiny_ensembl
    type: ensembl_gtf
    annotation:
      source: TinyFixture
      version: tiny
      path: examples/fixtures/genes.gtf

filtering:
  min_size_default: 10
  max_size_default: 500
  max_size_disease: 500
  max_size_cancer: 500

redundancy:
  jaccard_cutoff: 0.85

source_priority:
  biology_process_pathway: [REACTOME, LOCAL]

ncbi_gene:
  enabled: false

ensembl_archive:
  enabled: false
