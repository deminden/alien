project:
  # Download/cache root for MSigDB, Enrichr, HGNC, GENCODE, NCBI, and conversion helpers.
  source_dir: data/alien_sources
  # Output root. ALIEN writes gmt/, metadata/, and qc/ subfolders here.
  outdir: results/alien_outputs/function_location

outputs:
  include_symbols: false

sources:
  - type: msigdb_remote
    version: "2026.1"
    db_species: HS
    collection: C5
    subcollection: GO:MF
  - type: msigdb_remote
    version: "2026.1"
    db_species: HS
    collection: C5
    subcollection: GO:CC

targets:
  - name: gtex_v11_gencode47
    type: ensembl_gtf
    annotation:
      source: GENCODE
      version: "47"

filtering:
  min_size_default: 10
  max_size_default: 500
  remove_empty_after_output_gene_projection: true

redundancy:
  exact_duplicate_removal: true
  jaccard_cutoff: 0.85
  apply_per_family: true

source_priority:
  biology_function_location: [GOMF, GOCC]

runtime:
  workers: 16
