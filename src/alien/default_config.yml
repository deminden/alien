project:
  name: alien
  source_dir: data/alien_sources
  outdir: data/alien_gmt

outputs:
  include_symbols: true

sources:
  - type: msigdb_cache
    name: msigdb
    path: data/alien_sources/msigdb
    include_c4_cm: false

targets:
  - name: human_gencode47
    type: ensembl_gtf
    annotation:
      source: GENCODE
      version: "47"

runtime:
  workers: 1
