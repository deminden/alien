# Per-cell-line gene sets: one term per cell line. Opt-in, for questions about cell-line models (which lines
# resemble my samples, which dependencies are shared). In bulk tissue they mostly re-detect immune infiltration
# (haematopoietic lines) and proliferation (DepMap common essentials), so they are not in any default collection.
project:
  # Download/cache root for MSigDB, Enrichr, HGNC, GENCODE, NCBI, and conversion helpers.
  source_dir: data/alien_sources
  # Output root. ALIEN writes gmt/, metadata/, and qc/ subfolders here.
  outdir: results/alien_outputs/cell_line_signatures

outputs:
  include_symbols: false

sources:
  - type: enrichr_remote
    libraries:
      # CRISPR gene dependencies per cell line (DepMap).
      - name: DepMap
        match: "DepMap.*(CRISPR|Dependency)|DepMap"
        source_tag: DEPMAP
        family: cell_line_signature
        aspect: dependency_signature
      # Genes over-expressed in each CCLE line (microarray era; many LOC identifiers, rescued through NCBI Gene IDs).
      - name: Cancer Cell Line Encyclopedia
        match: "^Cancer_Cell_Line_Encyclopedia$|Cancer.*Cell.*Line.*Encyclopedia"
        source_tag: CCLE
        family: cell_line_signature
        aspect: expression_signature
      # Genes over-expressed in each NCI-60 line.
      - name: NCI-60
        match: "^NCI-60_Cancer_Cell_Lines$|NCI-60"
        source_tag: NCI60
        family: cell_line_signature
        aspect: expression_signature

targets:
  - name: gtex_v11_gencode47
    type: ensembl_gtf
    annotation:
      source: GENCODE
      version: "47"

filtering:
  min_size_default: 10
  max_size_default: 500

redundancy:
  exact_duplicate_removal: true
  jaccard_cutoff: 0.85
  apply_per_family: true

source_priority:
  cell_line_signature:
    - DEPMAP
    - CCLE
    - NCI60

runtime:
  workers: 16
