[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioalien"
version = "0.1.5"
description = "Audited Library Integration for External Namespaces"
readme = "README-PYPI.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Denis Demin" }
]
keywords = ["gmt", "gene sets", "ensembl", "hgnc", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=3.0",
  "pyarrow>=24.0",
  "PyYAML>=6.0",
  "rdata>=1.0",
  "requests>=2.33",
  "urllib3>=2.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "pytest>=9.0",
  "twine>=6.0",
]

[project.scripts]
alien = "alien.cli:main"

[project.urls]
Homepage = "https://github.com/deminden/alien"
Issues = "https://github.com/deminden/alien/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alien = ["default_config.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
