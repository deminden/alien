[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioalien"
version = "0.1.6"
description = "Audited Library Integration for External Namespaces"
readme = "README-PYPI.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Denis Demin" }
]
keywords = ["gmt", "gene sets", "ensembl", "hgnc", "bioinformatics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pandas>=3.0",
  "pyarrow>=24.0",
  "PyYAML>=6.0",
  "rdata>=1.0",
  "requests>=2.33",
  "urllib3>=2.6",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "pytest>=9.0",
  "pytest-cov>=5.0",
  "twine>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
  "pre-commit>=3.5",
]

[project.scripts]
alien = "alien.cli:main"

[project.urls]
Homepage = "https://github.com/deminden/alien"
Issues = "https://github.com/deminden/alien/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alien = ["default_config.yml", "presets/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: test needs real network access (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF", "PERF", "BLE", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["alien"]
known-local-folder = ["conftest"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "PLR0917", "PLC0415", "E501"]
# Grandfathered violations; each entry is deleted when its module is refactored.
"src/alien/build.py" = ["E501", "PERF401", "PLR0913", "PLR0915", "PLR0917"]
"src/alien/config.py" = ["E501"]
"src/alien/filtering.py" = ["C901", "PERF401", "PLR0912", "PLR0913", "PLR0917", "PLW2901"]
"src/alien/mapping.py" = ["BLE001", "C901", "E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]
"src/alien/reports.py" = ["B905", "BLE001", "E501", "PLR0913", "PLR0917", "RUF005", "SIM105"]
"src/alien/sources.py" = ["B905", "C901", "BLE001", "E501", "PERF401", "PLC0415", "PLR0912", "PLR2004", "PLW2901", "RUF005", "SIM108", "SIM401"]
"src/alien/utils.py" = ["PLR2004", "PLW2901", "RUF005"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/alien"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rdata", "rdata.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["alien"]
branch = false

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

# Grandfathered strict-mode errors; each module is removed from this list when it is refactored.
[[tool.mypy.overrides]]
module = ["alien.build", "alien.filtering", "alien.mapping", "alien.reports", "alien.sources", "alien.utils"]
ignore_errors = true
