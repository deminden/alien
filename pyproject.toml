[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioalien"
version = "0.2.0"
description = "Audited Library Integration for External Namespaces"
readme = "README-PYPI.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Denis Demin" }
]
keywords = ["gmt", "gene sets", "ensembl", "hgnc", "bioinformatics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "filelock>=3.12",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pydantic>=2.6",
  "PyYAML>=6.0.1",
  "rdata>=1.0",
  "requests>=2.31",
  "urllib3>=2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.3",
  "pytest>=9.0",
  "pytest-cov>=5.0",
  "twine>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
  "pre-commit>=3.5",
  "hypothesis>=6.100",
  "numpy>=1.26",
]

[project.scripts]
alien = "alien.cli:main"

[project.urls]
Homepage = "https://github.com/deminden/alien"
Documentation = "https://github.com/deminden/alien/blob/main/docs/usage.md"
Changelog = "https://github.com/deminden/alien/blob/main/CHANGELOG.md"
Issues = "https://github.com/deminden/alien/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alien = ["config/presets/*.yml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: test needs real network access (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF", "PERF", "BLE", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["alien"]
known-local-folder = ["conftest"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "PLR0917", "PLC0415", "E501"]
"tests/legacy/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/alien"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rdata", "rdata.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["alien"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

