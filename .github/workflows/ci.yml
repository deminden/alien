name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Ruff format
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest -q --cov=alien --cov-report=term

  lowest-dependencies:
    name: Tests (lowest direct dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lowest supported dependency versions
        run: |
          uv venv .venv
          uv pip install --python .venv --resolution lowest-direct -e ".[dev]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q

  benchmark:
    name: Redundancy benchmark (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run benchmark
        run: |
          if [ -f benchmarks/redundancy_benchmark.py ]; then python benchmarks/redundancy_benchmark.py --terms 50000; fi

  network:
    name: Network integration (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run network tests
        run: python -m pytest -q -m network

  package:
    name: Package build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check PyPI README
        run: python scripts/generate_pypi_readme.py --check
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          alien --help
          python -c "import alien; print(alien.__version__)"
