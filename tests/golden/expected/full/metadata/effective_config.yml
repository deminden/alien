project:
  name: alien
  source_dir: <ROOT>/sources
outputs:
  include_symbols: true
  mode: full
term_id_collisions:
  action: rename
sources:
- enabled: true
  path: <ROOT>/inputs/msigdb_like.tsv
  source_tag: REACTOME
  family: biology_process_pathway
  aspect: pathway
  collection: C2
  type: msigdb_tsv
  term_name_column: gs_name
  symbol_column: gene_symbol
- enabled: true
  path: <ROOT>/inputs/canonical.tsv
  type: canonical_tsv
- enabled: true
  path: <ROOT>/inputs/local_pathways.gmt
  source: Local pathways
  source_tag: LOCAL
  family: biology_process_pathway
  aspect: pathway
  type: symbol_gmt
- enabled: true
  path: <ROOT>/inputs/local_disease.gmt
  source: Local disease
  source_tag: LOCALDIS
  family: disease_phenotype
  aspect: phenotype
  type: symbol_gmt
targets:
- name: fixture_annotation
  type: ensembl_gtf
  annotation:
    source: Fixture
    version: '1'
    path: <ROOT>/inputs/genes.gtf
    attributes:
      gene_id:
      - gene_id
      gene_name:
      - gene_name
      gene_biotype:
      - gene_type
      - gene_biotype
    metadata_fallbacks: []
- name: fixture_measured
  type: ensembl_gtf
  annotation:
    source: Fixture
    version: '1'
    path: <ROOT>/inputs/genes.gtf
    attributes:
      gene_id:
      - gene_id
      gene_name:
      - gene_name
      gene_biotype:
      - gene_type
      - gene_biotype
    metadata_fallbacks: []
  output_genes:
    path: <ROOT>/inputs/output_genes.tsv
    id_column: feature
    symbol_column: symbol
filtering:
  min_size_default: 2
  max_size_default: 8
  max_size_disease: 8
  max_size_cancer: 8
  drop_broad_disease_terms: true
  broad_disease_regex:
  - ^disease$
  - ^diseases$
  - ^cancer$
  - ^neoplasm$
  - ^neoplasms$
  - ^malignant neoplasm$
  - ^malignant neoplasms$
  - ^carcinoma$
  - ^tumor$
  - ^tumour$
  - ^genetic disease$
  - ^genetic disorder$
  - ^(.+ )?system diseases?$
  - ^disease of (anatomical entity|cellular proliferation|metabolism|mental health)$
  - ^disease by infectious agent$
  - ^physical disorder$
  - ^syndromes?$
  - ^(inflammation|hyperplasia|fibrosis|necrosis|pathologic processes|disease progression|carcinogenesis)$
  - ^(neoplasm metastasis|neoplasm invasiveness|tumor progression|cell transformation,
    neoplastic)$
  - ^(chronic disease|acute disease|disease susceptibility|genetic predisposition
    to disease)$
  - ^(congenital abnormality|congenital abnormalities)$
  - ^(hp )?(phenotypic abnormality|abnormality of (the )?(nervous system|cardiovascular
    system|musculoskeletal system|musculature|skeletal system|eye|ear|head or neck|integument|skin|genitourinary
    system|endocrine system|immune system|blood and blood forming tissues|metabolism/homeostasis|metabolism
    homeostasis|respiratory system|digestive system|prenatal development or birth|connective
    tissue|breast|voice|thoracic cavity|limbs|cellular phenotype))$
  exclude_terms:
    kegg_medicus_variant_and_pathogen:
      enabled: true
      description: KEGG MEDICUS mutant-variant and pathogen versions of reference
        pathways (host genes only, near-copies of the REFERENCE pathway).
      source_tags:
      - KEGG_MEDICUS
      patterns:
      - '^KEGG MEDICUS (VARIANT|PATHOGEN) '
    pathogen_specific_pathways:
      enabled: true
      description: Pathways named after one pathogen; they list host machinery (ribosome,
        interferon, actin) that other terms already cover.
      source_tags:
      - REACTOME
      - WIKIPATHWAYS
      - KEGG_MEDICUS
      - KEGG_LEGACY
      - BIOCARTA
      - PID
      patterns:
      - \b(SARS[ -]?COV[ -]?[12]?|SARSCOV2?|COVID[ -]?19|CORONAVIRUS|HIV[ -]?1?|INFLUENZA|HCMV|CYTOMEGALOVIRUS|EPSTEIN[
        -]?BARR|EBV|KSHV|HERPES|HEPATITIS [BC]|HBV|HCV|HPV|PAPILLOMAVIRUS|EBOLA|ZIKA|DENGUE|MEASLES|LEISHMANIA|TOXOPLASM\w*|PLASMODIUM|MALARIA|TUBERCULOSIS|MYCOBACTERI\w*|SALMONELLA|LISTERIA|LEGIONELLA|CHLAMYDIA|HELICOBACTER|ESCHERICHIA|E
        COLI|SHIGELLA|YERSINIA|STAPHYLOCOCC\w*|STREPTOCOCC\w*|ANTHRAX|CLOSTRIDI\w*|BOTULINUM|PERTUSSIS|VIBRIO|CHOLERA|PATHOGENIC|TRYPANOSOM\w*|AMOEBIASIS|SHIGELLOSIS|PROTOZOA\w*)\b
    hpo_modifiers:
      enabled: true
      description: 'HPO modifier and inheritance terms (onset, course, mode of inheritance,
        age of death): they describe how a phenotype presents, not a phenotype.'
      source_tags:
      - HPO
      patterns:
      - ^HP .*INHERITANCE( QUALIFIER)?$
      - ^HP (?!.* WITH ).*ONSET$
      - ^HP (DEATH IN [A-Z ]+|AGE OF DEATH|NEONATAL DEATH|PRENATAL DEATH|STILLBIRTH)$
      - ^HP (NONPROGRESSIVE|RAPIDLY PROGRESSIVE|SLOWLY PROGRESSIVE|PROGRESSIVE|SPORADIC|VARIABLE
        EXPRESSIVITY|GENETIC ANTICIPATION|EPISODIC|RECURRENT|CHRONIC|ACUTE|TRANSIENT|INCOMPLETE
        PENETRANCE|SOMATIC MOSAICISM|SEXUAL DIMORPHISM|CONTIGUOUS GENE SYNDROME|CLINICAL
        MODIFIER|CLINICAL COURSE|MORTALITY AGING|MODE OF INHERITANCE|FREQUENCY|PAST
        MEDICAL HISTORY)$
      - '^HP TYPIFIED BY '
    experimental_disease_models:
      enabled: true
      description: Animal-model and transplantable tumour-line terms in text-mined
        disease libraries.
      source_tags:
      - DISGENET
      patterns:
      - \bexperimental\b
      - '^experimental organism '
      - ^carcinoma, (ehrlich tumor|lewis lung|walker 256|krebs 2|brown-pearce)$
      - ^(melanoma, (b16|cloudman s91|harding-passey)|hepatoma, (morris|novikoff)|leukemia
        (l1210|p388)|sarcoma (180|37|yoshida)|rous sarcoma|avian [a-z ]+|erythroleukemia,
        friend|mammary tumor virus, mouse)$
      - '^(rat|mouse|murine|canine|feline|bovine|porcine|simian|equine) '
redundancy:
  exact_duplicate_removal: true
  jaccard_cutoff: 0.7
  apply_per_family: true
  linkage: single
source_priority:
  biology_process_pathway:
  - REACTOME
  - LOCAL
  biology_function_location:
  - GOMF
  - GOCC
  disease_phenotype:
  - LOCALDIS
  cancer_dependency_state:
  - DEPMAP
  cell_line_signature:
  - DEPMAP
  - CCLE
  - NCI60
gene_mapping:
  use_hgnc_alias_mapping: true
  min_alias_length: 4
  short_alias_source_tags:
  - DISGENET
  - JENSEN_DISEASES_TEXTMINING
  mitochondrial_legacy_symbols: true
  excel_date_symbols: true
  case_insensitive_symbols: true
  preserve_unmapped_symbols_in_symbol_gmt: true
  non_gene_tokens:
  - disease
  - diseases
  - phenotype
  - phenotypes
  - group
  - groups
  non_gene_token_regex: []
  manual_symbol_repairs:
    E5-BROKEN: EEE5
hgnc: {}
ncbi_gene:
  enabled: true
  allowed_source_tags:
  - DEPMAP
  gene_info_url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/GENE_INFO/Mammalia/Homo_sapiens.gene_info.gz
  gene_history_url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene_history.gz
  use_gene_info_synonyms: true
ensembl_archive:
  enabled: true
  endpoint: https://rest.ensembl.org/archive/id
  batch_size: 50
  connect_timeout_seconds: 30
  timeout_seconds: 120
  retry_attempts: 3
  retry_backoff_seconds: 5.0
  unresolved_print_limit: 20
runtime:
  workers: <N>
