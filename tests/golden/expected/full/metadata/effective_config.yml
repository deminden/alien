project:
  name: alien
  source_dir: <ROOT>/sources
outputs:
  include_symbols: true
  mode: full
term_id_collisions:
  action: error
sources:
- enabled: true
  path: <ROOT>/inputs/msigdb_like.tsv
  source_tag: REACTOME
  family: biology_process_pathway
  aspect: pathway
  collection: C2
  type: msigdb_tsv
  term_name_column: gs_name
  symbol_column: gene_symbol
- enabled: true
  path: <ROOT>/inputs/canonical.tsv
  type: canonical_tsv
- enabled: true
  path: <ROOT>/inputs/local_pathways.gmt
  source: Local pathways
  source_tag: LOCAL
  family: biology_process_pathway
  aspect: pathway
  type: symbol_gmt
- enabled: true
  path: <ROOT>/inputs/local_disease.gmt
  source: Local disease
  source_tag: LOCALDIS
  family: disease_phenotype
  aspect: phenotype
  type: symbol_gmt
targets:
- name: fixture_annotation
  type: ensembl_gtf
  annotation:
    source: Fixture
    version: '1'
    path: <ROOT>/inputs/genes.gtf
    attributes:
      gene_id:
      - gene_id
      gene_name:
      - gene_name
      gene_biotype:
      - gene_type
      - gene_biotype
    metadata_fallbacks: []
- name: fixture_measured
  type: ensembl_gtf
  annotation:
    source: Fixture
    version: '1'
    path: <ROOT>/inputs/genes.gtf
    attributes:
      gene_id:
      - gene_id
      gene_name:
      - gene_name
      gene_biotype:
      - gene_type
      - gene_biotype
    metadata_fallbacks: []
  output_genes:
    path: <ROOT>/inputs/output_genes.tsv
    id_column: feature
    symbol_column: symbol
filtering:
  min_size_default: 2
  max_size_default: 8
  max_size_disease: 8
  max_size_cancer: 8
  drop_broad_disease_terms: true
  broad_disease_regex:
  - ^disease$
  - ^diseases$
  - ^cancer$
  - ^neoplasm$
  - ^neoplasms$
  - ^malignant neoplasm$
  - ^malignant neoplasms$
  - ^carcinoma$
  - ^tumor$
  - ^tumour$
  - ^genetic disease$
  - ^genetic disorder$
redundancy:
  exact_duplicate_removal: true
  jaccard_cutoff: 0.7
  apply_per_family: true
  linkage: single
source_priority:
  biology_process_pathway:
  - REACTOME
  - LOCAL
  biology_function_location:
  - GOMF
  - GOCC
  disease_phenotype:
  - LOCALDIS
  cancer_dependency_state:
  - DEPMAP
gene_mapping:
  use_hgnc_alias_mapping: true
  preserve_unmapped_symbols_in_symbol_gmt: true
  non_gene_tokens:
  - disease
  - diseases
  - phenotype
  - phenotypes
  - group
  - groups
  non_gene_token_regex: []
  manual_symbol_repairs:
    E5-BROKEN: EEE5
ncbi_gene:
  enabled: true
  allowed_source_tags:
  - DEPMAP
  gene_info_url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/GENE_INFO/Mammalia/Homo_sapiens.gene_info.gz
  gene_history_url: https://ftp.ncbi.nlm.nih.gov/gene/DATA/gene_history.gz
  use_gene_info_synonyms: true
ensembl_archive:
  enabled: true
  endpoint: https://rest.ensembl.org/archive/id
  batch_size: 50
  connect_timeout_seconds: 30
  timeout_seconds: 120
  retry_attempts: 3
  retry_backoff_seconds: 5.0
  unresolved_print_limit: 20
runtime:
  workers: <N>
