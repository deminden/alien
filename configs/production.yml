project:
  name: alien
  source_dir: data/alien_sources
  outdir: data/alien_gmt

outputs:
  include_symbols: true

sources:
  - type: msigdb_cache
    name: msigdb
    path: data/alien_sources/msigdb
    include_c4_cm: false
  # Alternative Python-only source. It downloads and caches the msigdbr
  # Zenodo release archive, then reads the collection RDS files directly.
  # - type: msigdb_remote
  #   version: "2026.1"
  #   db_species: HS
  #   collection: C2
  - type: symbol_gmt
    name: local_symbolic_libraries
    paths: []
    source_tag: LOCAL
    family: biology_process_pathway
    aspect: pathway

targets:
  - name: human_gencode47
    type: ensembl_gtf
    annotation:
      source: GENCODE
      version: "47"

runtime:
  workers: 1
